<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Benny's Ballista</title>
<style>
/* ──────────────────────────────────────────────────────────────────────────
   Themes. Every colour in the game (canvas included) comes from one of these
   four palettes, so switching profile repaints the world as well as the UI.
   ────────────────────────────────────────────────────────────────────────── */
:root{
  --fs: 100%;
  --bg:#0a0a0a; --panel:#15161c; --panel2:#1d1f28; --line:#2e3140;
  --text:#f2f4f8; --dim:#a6adbb;
  --accent:#ff5c00; --accent2:#22d3ee; --violet:#8b5cf6;
  --focus:#ffd400; --good:#3ddc84; --bad:#ff5470;
  --sky1:#1b2a4a; --sky2:#3d5a80; --sky3:#9fb8d9; --hill:#22304a; --ground:#3a5a40; --dirt:#2b3f30; --sun:#fff4dc;
  --wood:#a9682f; --stone:#8d939c; --glass:#7fe6ff; --barrel:#c9442f; --crown:#ffc93c; --steel:#4a5160; --guard:#5f7a3c;
  /* The outline colour every 3D model and the minimap are drawn with. It used
     to be a hardcoded constant in two files, which meant High Contrast kept
     inking in dark brown on a black background — i.e. the outlines that buy
     most of the contrast disappeared in the profile that needs them most. */
  --ink:#2f231a;
}
/* "Ben Default" is the bare :root block above — the hub's brand colours.
   "Dark" is the same darkness without the orange/cyan branding, for anyone who
   finds the brand accents too loud. */
body[data-theme="dark"]{
  --bg:#0e1013; --panel:#171a1f; --panel2:#20242b; --line:#333944;
  --text:#eef1f5; --dim:#9aa3b0;
  --accent:#7aa2f7; --accent2:#9ece6a; --violet:#bb9af7;
  --focus:#e0af68; --good:#9ece6a; --bad:#f7768e;
  --sky1:#12161d; --sky2:#2a3140; --sky3:#4a5568; --hill:#1a1f29; --ground:#39433a; --dirt:#282f29; --sun:#c9d4e6;
  --wood:#96683c; --stone:#8a909a; --glass:#8fd3e8; --barrel:#b8574a; --crown:#e0af68; --steel:#454b57; --guard:#566b38;
  --ink:#12151a;
}
body[data-theme="light"]{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#e6eaf2; --line:#c3cad8;
  --text:#12151c; --dim:#4d566b;
  --accent:#c93f00; --accent2:#0d7c92; --violet:#6836d6;
  /* --focus carries near-black text, so it has to stay bright enough to read
     against it — a darker orange here drops below 4.5:1. */
  --focus:#e08900; --good:#137a44; --bad:#b3123a;
  --sky1:#bfe0ff; --sky2:#e8f4ff; --sky3:#fbfdff; --hill:#9dc0a6; --ground:#6aa06f; --dirt:#4d7350; --sun:#fff6e0;
  --wood:#b8763a; --stone:#a9b0ba; --glass:#6fd0ea; --barrel:#d1503a; --crown:#e3a900; --steel:#6b7385; --guard:#6f8a46;
  --ink:#2a2018;
}
body[data-theme="contrast"]{
  --bg:#000000; --panel:#000000; --panel2:#111111; --line:#ffffff;
  --text:#ffffff; --dim:#e8e8e8;
  --accent:#ffff00; --accent2:#00ffff; --violet:#ff00ff;
  --focus:#ffff00; --good:#00ff66; --bad:#ff3b3b;
  --sky1:#000000; --sky2:#101010; --sky3:#101010; --hill:#202020; --ground:#303030; --dirt:#181818; --sun:#ffffff;
  --wood:#ffa500; --stone:#ffffff; --glass:#00ffff; --barrel:#ff3b3b; --crown:#ffff00; --steel:#8a8a8a; --guard:#00ff00;
  /* Black ink on a black ground is no outline at all. Here the edging has to
     invert: white, matching --line, so every block still has a hard border. */
  --ink:#ffffff;
}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{
  background:var(--bg); color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  height:100vh; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}

#app{display:flex; flex-direction:column; height:100vh}

/* ── Header ─────────────────────────────────────────────────────────────── */
#hdr{
  display:flex; align-items:center; gap:.6rem;
  padding:.4rem .7rem; background:var(--panel); border-bottom:3px solid var(--line);
  flex:0 0 auto;
}
#ttl{font-size:1.25rem; font-weight:800; letter-spacing:.5px; color:var(--accent); white-space:nowrap}
#ttl span{color:var(--accent2)}
#hdrBtns{margin-left:auto; display:flex; gap:.4rem}
.hbtn{
  background:var(--panel2); color:var(--text); border:2px solid var(--line);
  border-radius:.5rem; font:inherit; font-size:.95rem; font-weight:700;
  min-height:2.6rem; min-width:2.6rem; padding:.3rem .7rem; cursor:pointer;
}
.hbtn:hover{border-color:var(--accent)}

/* ── Stage ──────────────────────────────────────────────────────────────── */
#stage{flex:1 1 auto; position:relative; display:flex; flex-direction:column; min-height:0; background:var(--bg)}
#cvWrap{flex:1 1 auto; position:relative; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden}
canvas{display:block; max-width:100%; max-height:100%; background:var(--sky1)}

/* HUD floats over the canvas */
#hud{
  position:absolute; top:.5rem; left:50%; transform:translateX(-50%);
  display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center;
  pointer-events:none; z-index:3;
}
.pill{
  background:rgba(0,0,0,.62); border:2px solid var(--line); border-radius:999px;
  padding:.2rem .8rem; font-size:.95rem; font-weight:700; white-space:nowrap;
}
body[data-theme="light"] .pill{background:rgba(255,255,255,.85)}
.pill b{color:var(--accent2)}

/* Top-down read of the aim window — castle footprint, objective markers,
   landing crosshair. Sits opposite the HUD pills so it never competes with
   them. Big and bold while actually composing a shot (.big, driven by
   canAct() in js/ui.js) since that's when it's doing real work as an aiming
   aid; shrinks out of the way the instant the shot is locked in and the
   camera takes over. Drawn at one native resolution (300x364, see
   index.html's canvas attrs) and only *displayed* smaller via these CSS
   dimensions, so shrinking never blurs it. */
#minimap{
  position:absolute; top:.5rem; right:.5rem; z-index:3;
  width:150px; height:182px;
  --mm-big-w:520px; --mm-big-h:632px;   /* Large by default; js/ui.js's applyMinimapSize() overrides for Medium */
  border:3px solid var(--line); border-radius:.6rem;
  background:rgba(0,0,0,.6);
  transition:width .3s ease, height .3s ease;
}
#minimap.big{ width:var(--mm-big-w); height:var(--mm-big-h); border-color:var(--focus) }
#minimap.mm-hidden{ display:none }
body[data-theme="light"] #minimap{background:rgba(255,255,255,.78)}

/* ── Shot bar: the ammo list, then the two meters ───────────────────────── */
#shotbar{
  flex:0 0 auto; background:var(--panel); border-top:3px solid var(--line);
  padding:.35rem .6rem; display:flex; flex-direction:column; gap:.3rem;
}
.lane{display:flex; align-items:center; gap:.4rem}
.lane[hidden]{display:none}
.laneLabel{
  flex:0 0 5.2rem; font-size:.9rem; font-weight:800; color:var(--dim);
  text-transform:uppercase; letter-spacing:.06em;
}
.lane.locked .laneLabel{color:var(--good)}
.chips{display:flex; gap:.35rem; flex-wrap:wrap; flex:1 1 auto}
.chip{
  background:var(--panel2); border:2px solid var(--line); border-radius:.55rem;
  color:var(--text); font:inherit; font-size:1rem; font-weight:700;
  min-height:2.9rem; padding:.35rem .75rem; cursor:pointer; position:relative;
}
.chip .sub{display:block; font-size:.72rem; font-weight:600; color:var(--dim)}
.chip.picked{border-color:var(--good); background:color-mix(in srgb, var(--good) 18%, var(--panel2))}
.chip.last::after{
  content:'last'; position:absolute; top:-.55rem; right:-.35rem;
  background:var(--violet); color:#fff; font-size:.6rem; font-weight:800;
  padding:.05rem .3rem; border-radius:.3rem;
}
.chip.focus{
  border-color:var(--focus); background:var(--focus); color:#1a1400;
  box-shadow:0 0 0 4px color-mix(in srgb, var(--focus) 45%, transparent);
}
.chip.focus .sub{color:#3a2f00}
.chip:disabled{opacity:.4; cursor:default}
.chip.depleted{opacity:.55}
.chip.depleted .sub{color:var(--bad)}
.chip.depleted.focus{opacity:1}
.chip.depleted.focus .sub{color:#3a2f00}
.chip.act{font-weight:800; border-color:var(--accent); color:var(--accent)}
.lane.active .chip.act{background:var(--accent); color:#0d1220; border-color:var(--accent)}

/* ── Meters: the swept angle and the charged power ──────────────────────── */
.meter{
  flex:1 1 auto; position:relative; height:2.9rem; border-radius:.55rem;
  background:var(--panel2); border:2px solid var(--line); overflow:hidden;
}
.meter .fill{
  position:absolute; inset:0 auto 0 0; width:0%;
  background:linear-gradient(90deg, var(--accent2), var(--accent));
  transition:none;                      /* the loop already moves it every frame */
}
.meter .mval{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:1.05rem; color:var(--text);
  text-shadow:0 1px 3px rgba(0,0,0,.65);
}
.meter.dim .fill{opacity:.35}
.meter.dim .mval{color:var(--dim)}
.lane.active .meter{border-color:var(--focus)}
.lane.moving .meter{box-shadow:0 0 0 4px color-mix(in srgb, var(--focus) 45%, transparent)}
.lane.locked .meter{border-color:var(--good)}
/* Ticks every 10% so the meter reads as a scale, not just a bar. */
.meter::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg,
    transparent 0 calc(10% - 2px), rgba(255,255,255,.18) calc(10% - 2px) 10%);
}

/* ── Select-target aim mode's focus readout ──────────────────────────────
 * One box, not one chip per block (a castle can have dozens) — see
 * js/ui.js's renderTargetChips(). Same box language as .meter above so it
 * reads as "the same kind of control", just showing text instead of a fill.
 */
.targetFocus{
  flex:1 1 auto; min-height:2.9rem; border-radius:.55rem;
  background:var(--panel2); border:2px solid var(--line);
  display:flex; align-items:center; padding:0 .75rem;
  font-weight:800; font-size:1rem; color:var(--text);
}
.lane.locked .targetFocus{border-color:var(--good)}

/* ── Footer ─────────────────────────────────────────────────────────────── */
#ftr{
  flex:0 0 auto; display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
  padding:.35rem .7rem; background:var(--panel); border-top:3px solid var(--line);
  font-size:.85rem; color:var(--dim);
}
#ftrMode{font-weight:800; color:var(--accent)}
#ftrTarget{font-weight:700; color:var(--text)}
#ftrLegend{margin-left:auto; white-space:nowrap}
kbd{
  background:var(--panel2); border:1px solid var(--line); border-radius:.3rem;
  padding:0 .3rem; font-family:inherit; font-weight:700; color:var(--text);
}

/* ── Overlays (menus, pause, results, help) ─────────────────────────────── */
#overlay{
  position:absolute; inset:0; z-index:10;
  display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,.82); padding:1rem; overflow:auto;
}
body[data-theme="light"] #overlay{background:rgba(230,236,245,.93)}
#overlay.on{display:flex}
#panel{
  background:var(--panel); border:3px solid var(--line); border-radius:1rem;
  padding:1rem 1.1rem; width:min(46rem,100%); max-height:100%; overflow:auto;
}
#panelTitle{font-size:1.5rem; font-weight:800; color:var(--accent); margin-bottom:.15rem}
#panelSub{font-size:.95rem; color:var(--dim); margin-bottom:.8rem; line-height:1.45}
#panelList{display:flex; flex-direction:column; gap:.45rem}
.mi{
  display:flex; align-items:center; gap:.6rem; text-align:left;
  background:var(--panel2); border:2px solid var(--line); border-radius:.6rem;
  color:var(--text); font:inherit; font-size:1.1rem; font-weight:700;
  min-height:3.4rem; padding:.5rem .9rem; cursor:pointer; width:100%;
}
.mi .mval{margin-left:auto; color:var(--accent2); font-weight:800}
.mi.focus{
  border-color:var(--focus); background:var(--focus); color:#1a1400;
  box-shadow:0 0 0 4px color-mix(in srgb, var(--focus) 45%, transparent);
}
.mi.focus .mval{color:#3a2f00}
.mi:disabled{opacity:.45; cursor:default}
.mi.dim{opacity:.55}
.mi.dim.focus{opacity:1}
#panelNote{margin-top:.7rem; font-size:.85rem; color:var(--dim); line-height:1.5}
#panelNote b{color:var(--text)}
.stars{color:var(--crown); letter-spacing:.1em}

/* Screen-reader live region — keeps the announced text in the DOM too. */
#sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

@media (max-width:620px){
  #ttl{font-size:1rem}
  .laneLabel{flex-basis:4rem; font-size:.78rem}
  #ftrLegend{display:none}
}
</style>
</head>
<body data-theme="ben">

<div id="app">
  <header id="hdr">
    <div id="ttl">BENNY'S <span>BALLISTA</span></div>
    <div id="hdrBtns">
      <button class="hbtn" id="btnHelp"  title="How to play">? Help</button>
      <button class="hbtn" id="btnSet"   title="Settings">Settings</button>
      <button class="hbtn" id="btnExit"  title="Exit to hub">Exit</button>
    </div>
  </header>

  <main id="stage">
    <div id="cvWrap">
      <div id="loading" style="position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--dim);font-weight:700">Loading…</div>
      <div id="hud">
        <div class="pill" id="pLevel">Level 1</div>
        <div class="pill" id="pCrowns">Crowns <b>0</b></div>
        <div class="pill" id="pBolts">Bolts <b>0</b></div>
        <div class="pill" id="pScore">Score <b>0</b></div>
      </div>
      <canvas id="minimap" width="520" height="632" aria-hidden="true"></canvas>
    </div>

    <div id="shotbar">
      <div class="lane" id="laneAmmo"  hidden><span class="laneLabel">Ammo</span><div class="chips" id="chipsAmmo"></div></div>
      <!-- Select-target aim mode: replaces the Aim/Range lanes below rather
           than joining them — picking a block sets yaw and range in one act.
           laneAim/lanePower hide themselves when this mode is on (see
           js/ui.js's renderMeters()), same shown/hidden discipline laneAmmo
           already uses for the one-ammo-unlocked case. -->
      <div class="lane" id="laneTarget" hidden>
        <span class="laneLabel">Target</span>
        <div class="targetFocus" id="targetFocus">Press space to scan targets.</div>
        <button class="chip act" id="btnLockTarget" type="button">Lock</button>
        <button class="chip act" id="btnFireTarget" type="button">Fire</button>
      </div>
      <div class="lane" id="laneAim">
        <span class="laneLabel">Aim</span>
        <!-- ids stay the historical "Aim" from the 2D angle meter; it now
             drives lateral yaw, not elevation — see js/ui.js. -->
        <div class="meter" id="meterAim" role="progressbar" aria-label="Aim"
             aria-valuemin="-20" aria-valuemax="20" aria-valuenow="0"><div class="fill" id="fillAim"></div><span class="mval" id="valAim">0&deg;</span></div>
        <button class="chip act" id="btnLockAim" type="button">Lock</button>
      </div>
      <div class="lane" id="lanePower">
        <span class="laneLabel">Range</span>
        <!-- ids stay the historical "Power" from the 2D charge meter; it now
             picks landing distance, not muzzle speed — see js/ui.js. -->
        <div class="meter" id="meterPower" role="progressbar" aria-label="Range"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fillPower"></div><span class="mval" id="valPower">0%</span></div>
        <button class="chip act" id="btnFire" type="button">Fire</button>
      </div>
    </div>

    <div id="overlay">
      <div id="panel">
        <div id="panelTitle"></div>
        <div id="panelSub"></div>
        <div id="panelList"></div>
        <div id="panelNote"></div>
      </div>
    </div>
  </main>

  <footer id="ftr">
    <span id="ftrMode">Menu</span>
    <span id="ftrTarget"></span>
    <span id="ftrLegend"><kbd>Space hold</kbd> aim / charge &nbsp;·&nbsp; <kbd>Return</kbd> stop, then lock or fire &nbsp;·&nbsp; <kbd>Return hold</kbd> back / menu</span>
  </footer>
</div>

<div id="sr" aria-live="polite" role="status"></div>

<script src="../../../shared/safe-audio.js"    onerror="console.warn('safe-audio.js not loaded')"></script>
<script src="../../../shared/voice-manager.js" onerror="console.warn('voice-manager.js not loaded')"></script>
<script src="../../../shared/ios-audio-fix.js" onerror="console.warn('ios-audio-fix.js not loaded')"></script>
<script src="../../../shared/scan-manager.js"  onerror="console.warn('scan-manager.js not loaded')"></script>
<script src="js/three.min.js"></script>
<script src="js/ammo.js"></script>
<script src="js/util.js"></script>
<script src="js/models.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/levels.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/physics.js"></script>
<script src="js/settle.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
